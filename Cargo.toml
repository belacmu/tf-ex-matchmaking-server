[package]
name = "tf-ex-matchmaking-server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.68"
axum =  { version = "0.6.15",features = ["ws", "headers"]  } 
axum-typed-websockets = { version = "0.5.0", features = ["serde_json"] }
futures = "0.3"
headers = "0.3"
rand = "0.8.5"
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.96"
tokio = { version = "1.27.0", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.4.0", features = ["fs", "trace"] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
hyper = { version = "0.14", features = ["full"] }
hyper-tls = "0.5.0"
base64 = "0.21.0"
geoutils =  { version = "0.5.1", features = ["serde"] }
lazy_static = "1.4.0"
matchbox_protocol = {version = "0.15.0" , features = ["json"] }
metrics = { version = "0.24.1", default-features = false }
metrics-exporter-prometheus = { version = "0.16.2", default-features = false }
metrics-util = { version = "0.19", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
tokio-stream = "0.1.14"
uuid = { version = "1.3.3" , features = ["v4"] }

[features]
test-support = []
